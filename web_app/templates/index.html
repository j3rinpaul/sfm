<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COLMAP Web Viewer</title>
    <style>
        /* Remove margins so the 3D canvas fills the screen */
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
        #loading { position: absolute; top: 20px; left: 20px; color: white; font-family: sans-serif; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Loading point cloud...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Mouse Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Makes movement smooth

        // 3. Load the PLY File
        const loader = new PLYLoader();
        loader.load('/static/model.ply', function (geometry) {
            
            // Adjust the 'size' parameter if your points look too big or too small
            const material = new THREE.PointsMaterial({ 
                size: 0.05, 
                vertexColors: true 
            });
            
            const points = new THREE.Points(geometry, material);
            
            // Center the model in the scene
            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            points.position.sub(center);

            scene.add(points);
            document.getElementById('loading').style.display = 'none';

        }, undefined, function (error) {
            console.error(error);
            document.getElementById('loading').innerText = "Error loading model.";
        });

        // 4. Handle Window Resizing
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 5. The Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
